# Netlify: Add new site > Import from Git > pick this repo. Settings below are read automatically.
# Set VITE_API_URL in Site settings > Environment variables, e.g. https://sabkidukaan-api.onrender.com
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every path (e.g. /s/shop-name) loads index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build files never change, so browsers can cache them for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
